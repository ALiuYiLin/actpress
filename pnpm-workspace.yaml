packages:
  - docs
  - __tests__/*

autoInstallPeers: false

ignoreWorkspaceRootCheck: true

onlyBuiltDependencies:
  - esbuild
  - playwright-chromium
  - simple-git-hooks

overrides:
  ora>string-width: ^5
  vite: npm:rolldown-vite@latest
  # 钉死 markdown-it-anchor@9.2.0：patchedDependencies 的补丁针对 9.2.0，
  # 若重新解析到更新的 9.x（registry 最新为 9.2.1），pnpm 会报 ERR_PNPM_UNUSED_PATCH
  markdown-it-anchor: 9.2.0

patchedDependencies:
  '@types/markdown-it-attrs': patches/@types__markdown-it-attrs@4.1.3.patch
  '@types/mdurl@2.0.0': patches/@types__mdurl@2.0.0.patch
  markdown-it-anchor@9.2.0: patches/markdown-it-anchor@9.2.0.patch
  markdown-it-attrs@4.3.1: patches/markdown-it-attrs@4.3.1.patch

shellEmulator: true
